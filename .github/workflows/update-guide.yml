name: Refresh TV guide
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-guide
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guide
        run: python update_guide.py
      - name: Publish updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml guide-status.json parents-boston-tv.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh TV guide"
            git push
          fi
